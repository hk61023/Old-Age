server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 34.96.234.253;
    root /opt/yanglao/current/dist;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # Only four explicitly public, read-only API routes are forwarded.
    location ~ ^/api/(health|regions|regional-references|policies|income-statistics)$ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3210;
        proxy_set_header Host 127.0.0.1:3210;
        proxy_set_header Connection "";
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_read_timeout 30s;
    }
    location /api/ { return 404; }
    location /admin { return 404; }
    location ~ /\. { return 404; }
    location /assets/ {
        limit_except GET { deny all; }
        expires 7d;
        try_files $uri =404;
    }
    location / {
        limit_except GET { deny all; }
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
